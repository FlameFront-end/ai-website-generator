name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: "Build & Push Images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          PREFIX=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=latest" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/client/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/client:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/server:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
