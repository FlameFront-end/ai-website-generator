name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Client ────────────────────────────────────────────────────────
  client-lint:
    name: "Client · Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace app/client

  client-typecheck:
    name: "Client · Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --workspace app/client tsc --noEmit

  client-test:
    name: "Client · Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace app/client

  # ── Server ────────────────────────────────────────────────────────
  server-lint:
    name: "Server · Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace app/server

  server-typecheck:
    name: "Server · Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --workspace app/server tsc --noEmit

  # ── Docker build smoke test ───────────────────────────────────────
  docker-build:
    name: "Docker · Build"
    runs-on: ubuntu-latest
    needs: [client-lint, client-typecheck, client-test, server-lint, server-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/client/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
