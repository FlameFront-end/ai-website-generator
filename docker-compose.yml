services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-website-generator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_website_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2004
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_website_generator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-website-generator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
