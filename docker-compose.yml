services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-website-generator-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PUBLIC_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-website-generator-redis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${REDIS_PUBLIC_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data

  server:
    build:
      context: .
      dockerfile: app/server/Dockerfile
    container_name: ai-website-generator-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PUBLIC_PORT}:${API_PORT}"
    volumes:
      - generated-data:${GENERATED_ROOT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: app/client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ai-website-generator-client
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${CLIENT_PUBLIC_PORT}:80"
    depends_on:
      - server

volumes:
  postgres-data:
  redis-data:
  generated-data:
